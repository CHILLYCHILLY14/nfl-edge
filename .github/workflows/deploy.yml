name: Deploy to GitHub Pages

# Publishes whatever is currently in site/ every time the repository changes.
#
# The Refresh model workflow also deploys at the end of its own run, so this one
# is the safety net rather than the main path: it means an edit made straight on
# GitHub -- a settings change, a manual fix -- goes live immediately instead of
# waiting for the next scheduled model run. Both share a concurrency group, so
# they queue behind each other rather than racing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-edge-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
